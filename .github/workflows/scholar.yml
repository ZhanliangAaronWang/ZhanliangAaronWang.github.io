name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install scholarly
      - run: python scripts/scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet scholar.json; then
            git add scholar.json
            git commit -m "Update Google Scholar stats"
            git push
          fi
