name: Update Google Scholar stats

on:
  push:
    paths:
      - ".github/workflows/scholar.yml"
      - "scripts/scholar.py"
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compatible Scholar dependencies
        # scholarly imports bibtexparser.bibdatabase, which was removed in v2.
        run: python -m pip install "scholarly==1.7.11" "bibtexparser==1.4.3"
      - name: Check dependency imports
        run: python -c "from bibtexparser.bibdatabase import BibDatabase; from scholarly import scholarly, ProxyGenerator"
      - run: python scripts/scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet scholar.json; then
            git add scholar.json
            git commit -m "Update Google Scholar stats"
            git push
          fi
