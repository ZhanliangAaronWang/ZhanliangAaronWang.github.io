name: Update Google Scholar stats

on:
  push:
    paths:
      - ".github/workflows/scholar.yml"
      - "scripts/scholar.py"
      - "scripts/test_scholar.py"
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install profile parser
        run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Test parsing and preservation of existing data
        run: python -m unittest discover -s scripts -p 'test_scholar.py' -v
      - name: Refresh Scholar statistics
        timeout-minutes: 3
        run: python scripts/scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet scholar.json; then
            git add scholar.json
            git commit -m "Update Google Scholar stats"
            git push
          fi
